<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title"><title id="title">KhataSaathi AI — Clarity for the everyday shop.</title><defs><linearGradient id="project-ledger-bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><pattern id="project-ledger-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77B9B" opacity=".09"/></pattern></defs><style>text{font-family:Arial,sans-serif} .mono{font-family:monospace} .orbit{transform-origin:960px 235px;animation:turn 35s linear infinite} @keyframes turn{to{transform:rotate(360deg)}} @media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style><rect width="1200" height="280" rx="24" fill="url(#project-ledger-bg)"/><rect width="1200" height="280" rx="24" fill="url(#project-ledger-grid)"/><text x="35" y="43" fill="#C77B9B" font-size="15" class="mono">01 / SELECTED BUILD</text><text x="35" y="98" fill="#F8F0F3" font-size="38" font-weight="700">KhataSaathi AI</text><text x="35" y="145" fill="#F8F0F3" font-size="24" >Clarity for the everyday shop.</text><text x="35" y="187" fill="#E5B5C7" font-size="19" >Customer credit. Inventory alerts. Reviewed OCR.</text><text x="35" y="245" fill="#C77B9B" font-size="15" class="mono">PYTHON / STREAMLIT / PANDAS / OLLAMA</text><rect x="850" y="55" width="230" height="170" rx="14" fill="#451126" stroke="#C77B9B"/><path d="M875 95h178m-178 35h178m-178 35h110M945 78v125" stroke="#E5B5C7" stroke-width="2"/><path d="m1000 190 18 18 40-47" stroke="#E5B5C7" stroke-width="5" fill="none"/></svg>