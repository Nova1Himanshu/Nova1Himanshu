<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title"><title id="title">Workbench — data, web experiences, AI and workflow tools</title><defs><linearGradient id="toolkit-studio-bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><pattern id="toolkit-studio-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77B9B" opacity=".09"/></pattern></defs><style>text{font-family:Arial,sans-serif} .mono{font-family:monospace} .orbit{transform-origin:960px 235px;animation:turn 35s linear infinite} @keyframes turn{to{transform:rotate(360deg)}} @media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style><rect width="1200" height="300" rx="24" fill="url(#toolkit-studio-bg)"/><rect width="1200" height="300" rx="24" fill="url(#toolkit-studio-grid)"/><text x="40" y="50" fill="#C77B9B" font-size="18" class="mono">THE WORKBENCH</text><text x="40" y="112" fill="#F8F0F3" font-size="26" >DATA &amp; APPS</text><text x="40" y="160" fill="#E5B5C7" font-size="20" >Python · Pandas</text><text x="40" y="198" fill="#E5B5C7" font-size="20" >Streamlit</text><text x="440" y="112" fill="#F8F0F3" font-size="26" >WEB EXPERIENCES</text><text x="440" y="160" fill="#E5B5C7" font-size="20" >JavaScript · WebGL</text><text x="440" y="198" fill="#E5B5C7" font-size="20" >Web Audio</text><text x="840" y="112" fill="#F8F0F3" font-size="26" >AI &amp; WORKFLOW</text><text x="840" y="160" fill="#E5B5C7" font-size="20" >Ollama · Gemma 4</text><text x="840" y="198" fill="#E5B5C7" font-size="20" >Git · GitHub Actions</text><text x="40" y="264" fill="#C77B9B" font-size="16" class="mono">TOOLS CHOSEN TO FIT THE PROBLEM.</text></svg>