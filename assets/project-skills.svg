<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title"><title id="title">GitHub Skills Engine — Give reusable knowledge a review process.</title><defs><linearGradient id="project-skills-bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><pattern id="project-skills-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77B9B" opacity=".09"/></pattern></defs><style>text{font-family:Arial,sans-serif} .mono{font-family:monospace} .orbit{transform-origin:960px 235px;animation:turn 35s linear infinite} @keyframes turn{to{transform:rotate(360deg)}} @media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style><rect width="1200" height="280" rx="24" fill="url(#project-skills-bg)"/><rect width="1200" height="280" rx="24" fill="url(#project-skills-grid)"/><text x="35" y="43" fill="#C77B9B" font-size="15" class="mono">03 / SELECTED BUILD</text><text x="35" y="98" fill="#F8F0F3" font-size="38" font-weight="700">GitHub Skills Engine</text><text x="35" y="145" fill="#F8F0F3" font-size="24" >Give reusable knowledge a review process.</text><text x="35" y="187" fill="#E5B5C7" font-size="19" >Discover. Collect. Review. Version.</text><text x="35" y="245" fill="#C77B9B" font-size="15" class="mono">PYTHON / GITHUB ACTIONS / MARKDOWN</text><g fill="#451126" stroke="#C77B9B" stroke-width="2"><rect x="825" y="100" width="75" height="75" rx="12"/><rect x="940" y="100" width="75" height="75" rx="12"/><rect x="1055" y="100" width="75" height="75" rx="12"/><path d="M900 138h40m75 0h40"/></g><g fill="none" stroke="#F8F0F3" stroke-width="3"><path d="M848 124h28m-28 12h28m-28 12h20m78-12 10 10 18-23m88 0h28v28h-28z"/></g></svg>