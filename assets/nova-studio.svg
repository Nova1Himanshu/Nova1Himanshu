<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title"><title id="title">Nova studio — ideas from everyday life, built into things you can use</title><defs><linearGradient id="nova-studio-bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><pattern id="nova-studio-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C77B9B" opacity=".09"/></pattern></defs><style>text{font-family:Arial,sans-serif} .mono{font-family:monospace} .orbit{transform-origin:960px 235px;animation:turn 35s linear infinite} @keyframes turn{to{transform:rotate(360deg)}} @media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style><rect width="1200" height="460" rx="24" fill="url(#nova-studio-bg)"/><rect width="1200" height="460" rx="24" fill="url(#nova-studio-grid)"/><text x="48" y="55" fill="#C77B9B" font-size="18" class="mono">N / NOVA STUDIO</text><text x="48" y="148" fill="#F8F0F3" font-size="65" font-weight="700">Nova1Himanshu</text><text x="50" y="210" fill="#F8F0F3" font-size="34" >Ideas from everyday life.</text><text x="50" y="257" fill="#E5B5C7" font-size="34" >Built into things you can use.</text><text x="50" y="330" fill="#C77B9B" font-size="17" class="mono">APPLIED AI  /  INTERACTIVE WEB  /  PRACTICAL TOOLS</text><text x="50" y="405" fill="#E5B5C7" font-size="17" class="mono">OBSERVE → PROTOTYPE → TEST → IMPROVE</text><circle cx="960" cy="235" r="138" fill="#451126" opacity=".45"/><g class="orbit" fill="none" stroke="#C77B9B"><ellipse cx="960" cy="235" rx="180" ry="68" transform="rotate(-35 960 235)"/><ellipse cx="960" cy="235" rx="180" ry="68" transform="rotate(35 960 235)"/><circle cx="960" cy="235" r="164" stroke-dasharray="3 12"/><circle cx="1105" cy="154" r="9" fill="#E5B5C7"/></g><path d="M904 278V190l112 88v-88" fill="none" stroke="#F8F0F3" stroke-width="12" stroke-linejoin="round"/></svg>